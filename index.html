,BrickColor:"BrickColor = the color of a brick.",Material:"Material = what it looks like: Wood, Neon, Glass, etc.",Enum:"Enum = Roblox's list of choices like Enum.Material.Neon",Anchored:"Anchored = if true, part won't fall. true = frozen in place.",Parent:"Parent = where the object lives. part.Parent = workspace means put it in the world.",Name:"Name = label of the object.",Size:"Size = how big the Part is.",Touched:"Touched = DOORBELL event. Fires when something touches the part.",Connect:":Connect = listen for the doorbell. When Touched happens, run this recipe.",hit:"hit = the thing that touched us (usually a leg or arm).","Parent:":"hit.Parent = the whole player model that owns that leg.",FindFirstChild:"FindFirstChild = look inside for something named X, like Humanoid.",Humanoid:"Humanoid = the health/brain inside every player.",Health:"Health = 0 = player dies.",leaderstats:"leaderstats = magic folder name. Roblox shows it as leaderboard top-right.",IntValue:"IntValue = a number box that Roblox can show in leaderstats.",Value:"Value = what's inside the box.",Folder:"Folder = a container to group things, like leaderstats.",PlayerAdded:"PlayerAdded = event that fires when a player joins your game.",Players:"Players = service that manages all players.",DataStoreService:"DataStoreService = Roblox's cloud save system. Like Google Drive for coins.",GetDataStore:'GetDataStore = open a specific save file, e.g. "Coins".',GetAsync:"GetAsync = DOWNLOAD saved data. Get the coins we saved before.",SetAsync:"SetAsync = UPLOAD/SAVE data to cloud.",pcall:"pcall = try to do something risky (like loading) without crashing if it fails.",WaitForChild:"WaitForChild = wait until thing exists, then get it. Avoids errors.",game:"game = your entire Roblox experience.",script:"script = the code object you're writing in.",pairs:"pairs = loop through all children one by one.",GetChildren:"GetChildren = list of all things inside this folder/part.",SetAttribute:'SetAttribute = sticky note on player. SetAttribute("Checkpoint", 3) = remember they reached 3.',UserId:"UserId = unique ID number for each Roblox player.",ClockTime:"ClockTime = time of day in Lighting."},Ni=[{id:1,title:"THE FOUNDATION",subtitle:"What is coding?",time:"45 min",xp:100,color:"#b8ff57",icon:"\uD83C\uDF31",goal:"Understand what code really is and run your first line.",build:"Interactive Output window that prints your name",analogy:"Coding = giving instructions to Roblox. Studio = your workshop, Scripts = instruction papers, Output = walkie-talkie back.",concept:"You write instructions, Roblox follows them in order. print() is you talking to yourself via Output. Without print, you are blind.",code:`-- Day 1: Your first instructions

print("Welcome to my game!")

-- Variables start tomorrow, today just talk

local function giveCoins(player, amount)
    print("Giving " .. amount .. " coins to " .. player)
    -- Imagine: player.Coins += amount
    return true
end

-- Doorbell: when Part touched
local part = workspace:WaitForChild("Coin")

part.Touched:Connect(function(hit)
    local player = game.Players:GetPlayerFromCharacter(hit.Parent)
    if player then
